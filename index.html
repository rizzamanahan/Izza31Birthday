<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fairyland Confirmation</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Georgia,'Times New Roman',serif;color:#7b315c;overflow-x:hidden;background:radial-gradient(circle at 20% 15%,#fff 0 3%,transparent 12%),linear-gradient(145deg,#ffd9eb,#eee1ff 50%,#d8f6e5)}
.wrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px;position:relative}.card{width:min(920px,100%);background:#fff9fcdd;border:2px solid #fff;border-radius:34px;box-shadow:0 20px 60px #a34d8040;backdrop-filter:blur(8px);overflow:hidden;display:grid;grid-template-columns:1fr 1fr;position:relative;z-index:2}.photo{min-height:560px;background:url('IMG_1867.jpeg') center/cover no-repeat;position:relative}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#db77a52e,transparent 45%)}.content{padding:52px 38px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}.crown{font-size:34px}.eyebrow{letter-spacing:.22em;text-transform:uppercase;font:700 12px Arial;color:#cc6a9e}.title{font-size:clamp(34px,5vw,58px);line-height:.95;margin:13px 0;color:#c14e88;text-shadow:0 2px #fff}.msg{font-family:Arial,sans-serif;font-size:18px;line-height:1.7;color:#734d67;margin:8px 0}.highlight{margin-top:18px;padding:18px 20px;border-radius:22px;background:linear-gradient(135deg,#ffe0ef,#eee3ff);font-weight:700}.small{font:13px Arial,sans-serif;margin-top:22px;color:#9b718b}.float{position:fixed;pointer-events:none;z-index:1;animation:fly linear infinite;filter:drop-shadow(0 3px 5px #a6558660)}.b1{left:7%;bottom:-10%;font-size:34px;animation-duration:12s}.b2{left:84%;bottom:-12%;font-size:26px;animation-duration:15s;animation-delay:2s}.b3{left:50%;bottom:-15%;font-size:22px;animation-duration:17s;animation-delay:5s}.s1{left:14%;bottom:-8%;font-size:20px;animation-duration:10s}.s2{left:72%;bottom:-8%;font-size:18px;animation-duration:13s;animation-delay:4s}@keyframes fly{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.9}50%{transform:translate(25px,-55vh) rotate(20deg)}100%{transform:translate(-20px,-115vh) rotate(-15deg);opacity:0}}
@media(max-width:720px){.wrap{padding:14px}.card{grid-template-columns:1fr;border-radius:28px}.photo{min-height:390px;background-position:center 35%}.content{padding:34px 23px}.msg{font-size:16px}.title{font-size:42px}}
</style>
</head>
<body>
<div class="float b1">🦋</div><div class="float b2">🦋</div><div class="float b3">🦋</div><div class="float s1">✨</div><div class="float s2">✨</div>
<main class="wrap"><section class="card">
<div class="photo" aria-label="Fairyland celebration photo"></div>
<div class="content"><div class="crown">👑</div><div class="eyebrow">A little fairyland note</div><h1 class="title">Confirmation<br>is now closed</h1>
<p class="msg">Sorry, this link is no longer available.<br><strong>Tapos na ang confirmation period.</strong></p>
<div class="highlight">Kindly reach out to me directly.<br>Baka pwede pa kitang ma-reserve. 🩷</div>
<p class="small">Thank you for being part of the fairyland magic ✨🦋</p></div>
</section></main>
</body></html>
